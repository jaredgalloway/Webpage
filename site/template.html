<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://www.googletagmanager.com; style-src 'self'; font-src 'self'">
    <title>{{title}}</title>
    {{seo_meta}}
    {{seo_jsonld}}
    <link rel="stylesheet" href="styles.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script src="analytics.js"></script>
</head>
<body class="terminal">
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="site-header">
      <div class="container">
        <div class="terminal-nav">
          <header class="terminal-logo">
            <div class="logo terminal-prompt"><a href="#hero" class="no-style">{{brand}}</a></div>
          </header>
          <nav class="terminal-menu" aria-label="Main navigation">
            <ul>
              {{nav_links}}
              <li><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode"><span class="theme-toggle__label"></span></button></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>

    <main id="main" class="container">
      {{hero}}
      {{about}}
      {{skills}}
      {{projects}}
      {{experience}}
      {{contact}}
    </main>

    <footer class="footer container">
      <hr>
      <p>{{footer}}</p>
    </footer>

    <script src="main.js" defer></script>
</body>
</html>
